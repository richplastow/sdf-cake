<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDF Cake</title>
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFklEQVR42mN4NmsHSYhhVMOohuGrAQAkCjgfnU0snQAAAABJRU5ErkJggg=="
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <canvas
      class="scene"
      tabindex="0"
      role="img"
      aria-label="A round cake with a slice cut out, turning slowly"
    ></canvas>
    <div class="controls">
      <button
        class="cake-arrow"
        type="button"
        data-walk="previous"
        aria-label="Previous"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
      <input
        class="eaten-slider"
        type="range"
        min="0"
        max="0"
        step="1"
        value="0"
        aria-label="Eaten"
        data-slider="eaten"
      />
      <button
        class="cake-arrow"
        type="button"
        data-walk="next"
        aria-label="Next"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </button>
      <input
        class="reveal-slider"
        type="range"
        min="0"
        max="0"
        step="1"
        value="0"
        aria-label="Reveal"
        data-slider="reveal"
      />
    </div>
  </body>
</html>
